<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>World Cup 2026 Predictor</title>

<style>
body { margin:0; font-family:Arial; background:#0b1220; color:white; }
h1 { text-align:center; padding:15px; }

.topbar{
  text-align:center;
  padding:10px;
}

.container { display:flex; flex-wrap:wrap; gap:10px; padding:10px; justify-content:center; }

.group {
  background:#121a2a;
  padding:10px;
  border-radius:8px;
  width:220px;
}

.team {
  padding:6px;
  margin:4px 0;
  background:#1e2a44;
  border-radius:5px;
  cursor:pointer;
}

.team.selected { background:#2ecc71; }

button {
  padding:10px 15px;
  margin:10px;
  cursor:pointer;
}

.stage {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  padding:10px;
  justify-content:center;
}

.match {
  background:#121a2a;
  padding:10px;
  border-radius:8px;
  min-width:220px;
}

.pick {
  cursor:pointer;
  padding:5px;
  margin:4px 0;
  background:#1e2a44;
  border-radius:5px;
}
.pick:hover { background:#34495e; }

.counter {
  font-size:18px;
  margin-top:5px;
}
</style>
</head>

<body>

<h1>2026 World Cup Predictor (48 Teams)</h1>

<div class="topbar">
  <button onclick="buildKnockout()">Generate Knockout</button>
  <button onclick="resetAll()">Reset</button>
  <div class="counter" id="counter">Selected: 0 / 32</div>
</div>

<div class="container" id="groups"></div>

<h2 style="text-align:center;">Knockout Stage</h2>
<div class="stage" id="knockout"></div>

<script>

const groupData = {
A:["墨西哥","南非","韩国","捷克"],
B:["加拿大","波黑","卡塔尔","瑞士"],
C:["巴西","摩洛哥","海地","苏格兰"],
D:["美国","巴拉圭","澳大利亚","土耳其"],
E:["德国","库拉索","科特迪瓦","厄瓜多尔"],
F:["荷兰","日本","瑞典","突尼斯"],
G:["比利时","埃及","伊朗","新西兰"],
H:["西班牙","佛得角","沙特阿拉伯","乌拉圭"],
I:["法国","塞内加尔","伊拉克","挪威"],
J:["阿根廷","阿尔及利亚","奥地利","约旦"],
K:["葡萄牙","刚果（金）","乌兹别克斯坦","哥伦比亚"],
L:["英格兰","克罗地亚","加纳","巴拿马"]
};

const groups = Object.keys(groupData);

let state = {}; // selections

function countSelected(){
  let total = 0;
  groups.forEach(g=>{
    if(state[g]) total += state[g].size;
  });
  document.getElementById("counter").innerText = `Selected: ${total} / 32`;
  return total;
}

function renderGroups(){
  const container = document.getElementById("groups");
  container.innerHTML = "";

  groups.forEach(g => {
    const div = document.createElement("div");
    div.className = "group";
    div.innerHTML = `<h3>Group ${g}</h3>`;

    groupData[g].forEach(team => {
      const el = document.createElement("div");
      el.className = "team";
      el.innerText = team;

      el.onclick = () => {
        if(!state[g]) state[g] = new Set();

        if(state[g].has(team)){
          state[g].delete(team);
          el.classList.remove("selected");
        } else {

          if(state[g].size >= 3){
            alert("Each group can only select 3 teams");
            return;
          }

          if(countSelected() >= 32 && !state[g].has(team)){
            alert("You already selected 32 teams");
            return;
          }

          state[g].add(team);
          el.classList.add("selected");
        }

        countSelected();
      };

      div.appendChild(el);
    });

    container.appendChild(div);
  });

  countSelected();
}

function getSelectedTeams(){
  let arr = [];
  groups.forEach(g=>{
    if(state[g]){
      arr = arr.concat(Array.from(state[g]));
    }
  });
  return arr;
}

function buildKnockout(){

  const teams = getSelectedTeams();

  if(teams.length !== 32){
    alert("You must select exactly 32 teams to start knockout!");
    return;
  }

  const R = document.getElementById("knockout");
  R.innerHTML = "";

  let round = teams;
  let roundNum = 1;

  while(round.length > 1){

    const next = [];
    const box = document.createElement("div");
    box.className = "match";
    box.innerHTML = `<h3>Round ${roundNum}</h3>`;

    for(let i=0;i<round.length;i+=2){
      const a = round[i];
      const b = round[i+1];

      const winner = Math.random() > 0.5 ? a : b;
      next.push(winner);

      const line = document.createElement("div");
      line.innerHTML = `${a} vs ${b} → <b>${winner}</b>`;
      box.appendChild(line);
    }

    R.appendChild(box);
    round = next;
    roundNum++;
  }

  const final = document.createElement("h2");
  final.style.textAlign = "center";
  final.innerText = "🏆 Champion: " + round[0];
  R.appendChild(final);
}

function resetAll(){
  state = {};
  renderGroups();
  document.getElementById("knockout").innerHTML = "";
}

renderGroups();

</script>

</body>
</html>
